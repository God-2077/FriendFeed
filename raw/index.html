<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
    <head>
        <title>余弦の博客 - RSS Feed</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
        <link rel="stylesheet" type="text/css" href="feed.css"/>

        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    </head>
    <body style="background-color: #121214; color: #f0f0f0; margin: 0; padding: 0;">
        <div class="background-decorations">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="stars-container"></div>
        </div>
        <div class="container">
            <!-- Profile Section -->
            <header class="profile-header">
                <div class="profile-card">
                    <div class="avatar-wrapper">
                        <div class="avatar-container">
                            <img src="/img/avatar.webp" alt="cos" class="avatar"/>
                            <div class="cat-ear left"></div>
                            <div class="cat-ear right"></div>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h1 class="site-title">余弦の博客</h1>
                        <p class="site-subtitle">WA 的一声就哭了</p>
                        <p class="site-bio">一个基于 Astro 的现代化博客主题</p>
                        <div class="social-links">
                            <a href="https://github.com/your-username" target="_blank" class="social-btn github" title="Github">
                                <i class="ri-github-fill"></i>
                            </a>
                            <a href="mailto:your@email.com" target="_blank" class="social-btn email" title="Email">
                                <i class="ri-mail-line"></i>
                            </a>
                            <a href="/rss.xml" target="_blank" class="social-btn rss" title="Rss">
                                <i class="ri-rss-line"></i>
                            </a>
                        </div>
                    </div>
                    <div class="feed-actions">
                        <div class="feed-badge"><i class="ri-rss-fill"></i> RSS Feed Preview</div>
                        <a class="visit-btn" target="_blank" href="https://koharu.cosine.ren">访问网站 <i class="ri-arrow-right-line"></i></a>
                    </div>
                </div>
            </header>
            <main class="feed-content">
                <div class="content-header">
                    <h2><i class="ri-sparkling-fill"></i> 最近更新</h2>
                    <p class="feed-desc">WA 的一声就哭了</p>
                </div>
                <div class="articles-grid">
                    <article class="post-card">
                        <div class="card-glow"></div>
                        <div class="post-content">
                            <h3 class="post-title"><a target="_blank" href="https://koharu.cosine.ren/post/%E6%96%87%E7%AB%A0%E4%B8%80">文章一</a></h3>
                            <div class="post-meta">
                                <span class="meta-item date">
                                    <i class="ri-calendar-2-line"></i>05 Apr 2026
                                </span>
                            </div>
                            <p class="post-summary">这是一篇关于文章一的文章。</p>
                        </div>
                        <div class="post-footer">
                            <a class="read-more" target="_blank" href="https://koharu.cosine.ren/post/%E6%96%87%E7%AB%A0%E4%B8%80">阅读全文 <i class="ri-arrow-right-s-line"></i></a>
                        </div>
                    </article>
                    <article class="post-card">
                        <div class="card-glow"></div>
                        <div class="post-content">
                            <h3 class="post-title"><a target="_blank" href="https://koharu.cosine.ren/post/%E6%96%87%E7%AB%A0%E4%BA%8C">文章二</a></h3>
                            <div class="post-meta">
                                <span class="meta-item date">
                                    <i class="ri-calendar-2-line"></i>05 Apr 2026
                                </span>
                            </div>
                            <p class="post-summary">这是一篇关于文章二的文章。</p>
                        </div>
                        <div class="post-footer">
                            <a class="read-more" target="_blank" href="https://koharu.cosine.ren/post/%E6%96%87%E7%AB%A0%E4%BA%8C">阅读全文 <i class="ri-arrow-right-s-line"></i></a>
                        </div>
                    </article>
                </div>
            </main>
            <footer class="page-footer">
                <p>Designed with <i class="ri-heart-3-fill heart-beat"></i> by Author</p>
                <p class="copyright"><a href="https://aboutfeeds.com" target="_blank">About Feeds</a></p>
            </footer>
        </div>
    </body>
</html>
